name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Preference model tests
        run: node tests/test_preference_model.js
      - name: Compile check
        run: python -m compileall -q server.py mishu
      - name: Build container
        run: docker build -t mishu:test .

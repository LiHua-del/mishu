services:
  mishu:
    build: .
    container_name: mishu
    restart: unless-stopped
    environment:
      PORT: "8001"
      MISHU_DATA_DIR: /data
      AI_API_URL: "${AI_API_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_API_MODEL: "${AI_API_MODEL:-}"
      AI_TIMEOUT: "${AI_TIMEOUT:-25}"
      SEARCH_PROVIDER: "${SEARCH_PROVIDER:-direct}"
      BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY:-}"
      SEARCH_COUNTRY: "${SEARCH_COUNTRY:-CN}"
      SEARCH_LANG: "${SEARCH_LANG:-zh-hans}"
      SEARCH_TIMEOUT: "${SEARCH_TIMEOUT:-10}"
      MISHU_ACCESS_CODE: "${MISHU_ACCESS_CODE:-}"
      MISHU_SESSION_SECRET: "${MISHU_SESSION_SECRET:-}"
      MISHU_SESSION_DAYS: "${MISHU_SESSION_DAYS:-30}"
      MISHU_SYNC_DAYS: "${MISHU_SYNC_DAYS:-180}"
      MISHU_COOKIE_SECURE: "${MISHU_COOKIE_SECURE:-0}"
    volumes:
      - ./runtime-data:/data
    ports:
      - "127.0.0.1:${MISHU_PORT:-8001}:8001"
    read_only: true
    init: true
    pids_limit: 128
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
